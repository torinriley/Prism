# ci.yml — Prism
#
# The GPU tests are written with `.enabled(if: hasMetal)`, so on a machine without a Metal device they
# are *skipped* and `swift test` still exits 0. The "Require a Metal device" step makes that a failure
# instead. GitHub-hosted macOS runners do have one (an "Apple Paravirtual device" on a virtual M1; first
# CI run, October 2026), so the hosted runner is used. Its GPU is virtualized: results from it say nothing
# about performance, and device-specific behaviour (timestamp counters, threadgroup limits) may differ
# from real hardware.
#
# Shaders: SwiftPM on the hosted runners' toolchain only *copies* `.metal` files, it does not compile
# them (the first run failed with "no default library was found"). Prism falls back to compiling the
# bundled sources at runtime, so `swift test` below exercises that path, and the `test-xcode` job
# exercises the precompiled path through Xcode's build system.
#
# Toolchain: the package has only been built locally with Xcode 27 / Swift 6.4. Pin the Xcode you want
# tested (for example with maxim-lobanov/setup-xcode) rather than relying on whatever `macos-latest` carries.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-compile:
    name: Library compiles for iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true
      - name: iOS device
        run: xcodebuild -scheme Prism -destination 'generic/platform=iOS' build
      - name: iOS Simulator
        run: xcodebuild -scheme Prism -destination 'generic/platform=iOS Simulator' build

  test:
    name: Tests (${{ matrix.sanitizer }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [none, thread, address]
    steps:
      - uses: actions/checkout@v4
      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true
      - name: Require a Metal device
        run: |
          cat > /tmp/metal-check.swift <<'EOF'
          import Metal
          guard let device = MTLCreateSystemDefaultDevice() else {
              print("No Metal device: the GPU tests would be skipped, not run.")
              exit(1)
          }
          print("Metal device: \(device.name)")
          EOF
          swiftc /tmp/metal-check.swift -o /tmp/metal-check && /tmp/metal-check
      - name: Test
        run: |
          if [ "${{ matrix.sanitizer }}" = "none" ]; then
            swift test
          else
            swift test --sanitize=${{ matrix.sanitizer }}
          fi

  test-xcode:
    name: Tests (Xcode build system, precompiled shaders)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true
      - name: Test
        run: xcodebuild test -scheme Prism-Package -destination 'platform=macOS'

  release-build:
    name: Release build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true
      - name: Build (library, benchmarks, Studio)
        run: swift build -c release
      - name: Benchmark harness smoke test (not a measurement)
        run: swift run -c release prism-bench --quick --suite ops --resolutions 1080p
